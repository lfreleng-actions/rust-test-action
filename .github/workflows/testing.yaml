---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

# Action test/validation workflow
name: "Test GitHub Action 🧪"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  ### Unit tests: the scripts against stand-in tools ###
  unit-tests:
    name: "Unit tests (bats)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      # Load the egress allow-list out-of-band from the
      # organisation's .github repository and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: '@538904e241556d101fb908b50e2a2965fa0346cf'  # v0.16.6

      - name: "Harden runner (block)"
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed  # v2.22.0
        with:
          egress-policy: "block"
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install bats"
        shell: bash
        env:
          # bats-core v1.13.0
          BATS_COMMIT: "3bca150ec86275d6d9d5a4fd7d48ab8b6c6f3d87"
        run: |
          # Install bats
          dir="$RUNNER_TEMP/bats-core"
          git init -q "$dir"
          git -C "$dir" fetch -q --depth 1 \
            https://github.com/bats-core/bats-core.git "$BATS_COMMIT"
          git -C "$dir" checkout -q FETCH_HEAD
          "$dir/bin/bats" --version

      - name: "Run bats"
        shell: bash
        run: |
          # Run bats
          "$RUNNER_TEMP/bats-core/bin/bats" tests/

      - name: "Run shellcheck"
        shell: bash
        run: |
          # Run shellcheck
          shellcheck --version | sed -n 2p
          shellcheck scripts/*.sh tests/fixtures/*.sh
          shellcheck -s bash tests/run-tests.bats

  ### Published fixture: every runner, with and without coverage ###
  test-rust-project:
    # yamllint disable-line rule:line-length
    name: "Test test-rust-project (${{ matrix.runner }}, coverage ${{ matrix.coverage }})"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: ["cargo", "nextest"]
        coverage: ["false", "true"]
    steps:
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: '@538904e241556d101fb908b50e2a2965fa0346cf'  # v0.16.6

      - name: "Harden runner (block)"
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed  # v2.22.0
        with:
          egress-policy: "block"
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Checkout test-rust-project"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lfreleng-actions/test-rust-project
          ref: "5db6f8f6624e676d1d76f8db02a0253fee39900c"  # v0.0.1
          path: fixture
          persist-credentials: false

      - name: "Running local action: ${{ github.repository }}"
        id: test
        uses: $/
        with:
          path_prefix: fixture
          test_runner: ${{ matrix.runner }}
          coverage: ${{ matrix.coverage }}
          lockfile_required: "true"
          # yamllint disable-line rule:line-length
          artefact_name: "rust-test-${{ matrix.runner }}-coverage-${{ matrix.coverage }}-${{ github.run_attempt }}"

      - name: "Check outputs and reports"
        shell: bash
        env:
          RUNNER: ${{ matrix.runner }}
          COVERAGE: ${{ matrix.coverage }}
          TOOLCHAIN: ${{ steps.test.outputs.toolchain }}
          TOOLCHAIN_KIND: ${{ steps.test.outputs.toolchain_kind }}
          CARGO_VERSION: ${{ steps.test.outputs.cargo_version }}
          RUSTC_VERSION: ${{ steps.test.outputs.rustc_version }}
          TESTS_OUTCOME: ${{ steps.test.outputs.tests_outcome }}
          COVERAGE_PERCENT: ${{ steps.test.outputs.coverage_percent }}
          JUNIT_PATH: ${{ steps.test.outputs.junit_path }}
          LCOV_PATH: ${{ steps.test.outputs.coverage_lcov_path }}
          COBERTURA_PATH: ${{ steps.test.outputs.coverage_cobertura_path }}
        run: |
          # Check outputs and reports
          set -uo pipefail
          failed=0
          fail() {
            echo "::error::$*"
            failed=1
          }
          version_re='^[0-9]+\.[0-9]+\.[0-9]+'
          percent_re='^[0-9]{1,3}\.[0-9]{2}$'
          [ "$TESTS_OUTCOME" = passed ] || fail "tests_outcome is not passed"
          [ "$TOOLCHAIN_KIND" = channel ] \
            || fail "toolchain_kind is not channel"
          [ -n "$TOOLCHAIN" ] || fail "toolchain is empty"
          [[ "$CARGO_VERSION" =~ $version_re ]] \
            || fail "cargo_version is not a version"
          [[ "$RUSTC_VERSION" =~ $version_re ]] \
            || fail "rustc_version is not a version"
          if [ "$RUNNER" = nextest ]; then
            [ -s "$JUNIT_PATH" ] || fail "junit.xml is missing"
            # Four unit tests and two integration tests in the fixture.
            grep -q '<testsuites[^>]* tests="6"' "$JUNIT_PATH" \
              || fail "junit.xml does not record six tests"
          else
            [ -z "$JUNIT_PATH" ] || fail "junit_path is set for cargo"
          fi
          if [ "$COVERAGE" = true ]; then
            [[ "$COVERAGE_PERCENT" =~ $percent_re ]] \
              || fail "coverage_percent is not a percentage"
            [ -s "$LCOV_PATH" ] || fail "lcov.info is missing"
            [ -s "$COBERTURA_PATH" ] || fail "cobertura.xml is missing"
            grep -q '^SF:.*/src/lib\.rs$' "$LCOV_PATH" \
              || fail "lcov.info does not cover src/lib.rs"
          else
            [ -z "$COVERAGE_PERCENT$LCOV_PATH$COBERTURA_PATH" ] \
              || fail "coverage outputs are set without coverage"
          fi
          echo "Coverage: ${COVERAGE_PERCENT:-none}"
          exit "$failed"

  ### Download uploaded artefacts and check their contents ###
  check-artefact:
    name: "Check uploaded reports"
    needs: [test-rust-project, failure-paths]
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 10
    steps:
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: '@538904e241556d101fb908b50e2a2965fa0346cf'  # v0.16.6

      - name: "Harden runner (block)"
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed  # v2.22.0
        with:
          egress-policy: "block"
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      # Patterns, not names: re-running only the failed jobs leaves
      # the other uploads under an earlier run attempt's name. Matches
      # merge into one flat directory, whatever their number.
      - name: "Download the nextest coverage reports"
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "rust-test-nextest-coverage-true-*"
          path: reports
          merge-multiple: true

      # Uploaded by a step that failed, without permit_fail
      - name: "Download the failing run's reports"
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "rust-test-failing-strict-*"
          path: strict
          merge-multiple: true

      - name: "Download the permitted failing run's reports"
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "rust-test-failing-permitted-*"
          path: permitted
          merge-multiple: true

      - name: "Check the artefact contents"
        shell: bash
        run: |
          # Check the artefact contents
          set -euo pipefail
          ls -l reports strict permitted
          for file in reports/junit.xml reports/lcov.info \
            reports/cobertura.xml strict/junit.xml permitted/junit.xml \
            permitted/lcov.info permitted/cobertura.xml; do
            if [ ! -s "$file" ]; then
              echo "::error::The artefact lacks $file"
              exit 1
            fi
          done
          for file in strict/junit.xml permitted/junit.xml; do
            if ! grep -q 'fails_on_purpose' "$file" \
              || ! grep -q '<failure' "$file"; then
              echo "::error::$file records no failing test"
              exit 1
            fi
          done

  ### Generated fixture: failing tests, permit_fail and bad inputs ###
  failure-paths:
    name: "Failure paths"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: '@538904e241556d101fb908b50e2a2965fa0346cf'  # v0.16.6

      - name: "Harden runner (block)"
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed  # v2.22.0
        with:
          egress-policy: "block"
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A crate with one passing and one failing test and a doc test,
      # committed without a Cargo.lock in its own git repository.
      - name: "Generate a failing fixture"
        shell: bash
        run: |
          # Generate a failing fixture
          set -euo pipefail
          random="$(od -An -N4 -tx4 /dev/urandom | tr -d ' \n')"
          name="lfreleng-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${random}"
          mkdir -p failing/src
          printf '%s\n' '[package]' "name = \"$name\"" \
            'version = "0.1.0"' 'edition = "2021"' 'publish = false' \
            > failing/Cargo.toml
          printf '%s\n' \
            '/// ```' \
            '/// assert_eq!(1 + 1, 2);' \
            '/// ```' \
            'pub fn double(x: u32) -> u32 {' \
            '    x * 2' \
            '}' \
            '' \
            '#[cfg(test)]' \
            'mod tests {' \
            '    #[test]' \
            '    fn doubles() {' \
            '        assert_eq!(super::double(2), 4);' \
            '    }' \
            '' \
            '    #[test]' \
            '    fn fails_on_purpose() {' \
            '        assert_eq!(super::double(2), 5, "deliberate failure");' \
            '    }' \
            '}' > failing/src/lib.rs
          git -C failing init -q
          git -C failing add Cargo.toml src/lib.rs
          git -C failing -c user.name=CI -c user.email=ci@example.invalid \
            commit -q -m "Add failing fixture"
          echo "Fixture crate: $name"

      - name: "Missing lockfile with lockfile_required"
        id: no-lockfile
        continue-on-error: true
        uses: $/
        with:
          path_prefix: failing
          lockfile_required: "true"
          artefact_upload: "false"

      - name: "Failing tests fail the step"
        id: failing
        continue-on-error: true
        uses: $/
        with:
          path_prefix: failing
          artefact_upload: "false"

      # Reports kept in place below path_prefix, and uploaded although
      # the step fails
      - name: "Failing tests with artefact_path"
        id: strict
        continue-on-error: true
        uses: $/
        with:
          path_prefix: failing
          test_runner: "nextest"
          artefact_path: "test-reports"
          artefact_name: "rust-test-failing-strict-${{ github.run_attempt }}"

      - name: "Failing tests with permit_fail"
        id: permitted
        uses: $/
        with:
          path_prefix: failing
          test_runner: "nextest"
          coverage: "true"
          permit_fail: "true"
          # yamllint disable-line rule:line-length
          artefact_name: "rust-test-failing-permitted-${{ github.run_attempt }}"

      - name: "Invalid boolean input"
        id: bad-boolean
        continue-on-error: true
        uses: $/
        with:
          path_prefix: failing
          workspace: "yes"

      - name: "Invalid package name"
        id: bad-package
        continue-on-error: true
        uses: $/
        with:
          path_prefix: failing
          packages: "a;b"

      - name: "JUnit with the cargo runner"
        id: bad-junit
        continue-on-error: true
        uses: $/
        with:
          path_prefix: failing
          junit: "true"

      - name: "path_prefix outside the workspace"
        id: bad-path
        continue-on-error: true
        uses: $/
        with:
          path_prefix: ".."

      - name: "Verify failure paths"
        shell: bash
        env:
          NO_LOCKFILE: ${{ steps.no-lockfile.outcome }}
          NO_LOCKFILE_TESTS: ${{ steps.no-lockfile.outputs.tests_outcome }}
          FAILING: ${{ steps.failing.outcome }}
          FAILING_TESTS: ${{ steps.failing.outputs.tests_outcome }}
          PERMITTED: ${{ steps.permitted.outcome }}
          PERMITTED_TESTS: ${{ steps.permitted.outputs.tests_outcome }}
          PERMITTED_JUNIT: ${{ steps.permitted.outputs.junit_path }}
          PERMITTED_LCOV: ${{ steps.permitted.outputs.coverage_lcov_path }}
          # yamllint disable-line rule:line-length
          PERMITTED_PERCENT: ${{ steps.permitted.outputs.coverage_percent }}
          PERMITTED_PATH: ${{ steps.permitted.outputs.artefact_path }}
          PERMITTED_NAME: ${{ steps.permitted.outputs.artefact_name }}
          STRICT: ${{ steps.strict.outcome }}
          STRICT_TESTS: ${{ steps.strict.outputs.tests_outcome }}
          STRICT_PATH: ${{ steps.strict.outputs.artefact_path }}
          STRICT_JUNIT: ${{ steps.strict.outputs.junit_path }}
          STRICT_NAME: ${{ steps.strict.outputs.artefact_name }}
          ATTEMPT: ${{ github.run_attempt }}
          BAD_BOOLEAN: ${{ steps.bad-boolean.outcome }}
          BAD_BOOLEAN_TESTS: ${{ steps.bad-boolean.outputs.tests_outcome }}
          BAD_PACKAGE: ${{ steps.bad-package.outcome }}
          BAD_JUNIT: ${{ steps.bad-junit.outcome }}
          BAD_PATH: ${{ steps.bad-path.outcome }}
        run: |
          # Verify failure paths
          set -uo pipefail
          failed=0
          fail() {
            echo "::error::$*"
            failed=1
          }
          percent_re='^[0-9]{1,3}\.[0-9]{2}$'
          [ "$NO_LOCKFILE" = failure ] || fail "missing lockfile did not fail"
          [ "$NO_LOCKFILE_TESTS" = failed ] \
            || fail "missing lockfile did not report failed tests"
          [ "$FAILING" = failure ] || fail "failing tests did not fail"
          [ "$FAILING_TESTS" = failed ] \
            || fail "failing tests did not report failed"
          [ "$PERMITTED" = success ] || fail "permit_fail did not pass"
          [ "$PERMITTED_TESTS" = failed ] \
            || fail "permit_fail did not report failed"
          [ -s "$PERMITTED_JUNIT" ] || fail "permit_fail wrote no JUnit report"
          if ! grep -q 'fails_on_purpose' "$PERMITTED_JUNIT" \
            || ! grep -q '<failure' "$PERMITTED_JUNIT"; then
            fail "the JUnit report records no failing test"
          fi
          [ -s "$PERMITTED_LCOV" ] || fail "permit_fail wrote no lcov report"
          [[ "$PERMITTED_PERCENT" =~ $percent_re ]] \
            || fail "permit_fail gave no coverage figure"
          [[ "$PERMITTED_PATH" == "$RUNNER_TEMP"/rust-test-reports.* ]] \
            || fail "the default artefact_path is not below RUNNER_TEMP"
          [ "$PERMITTED_NAME" = "rust-test-failing-permitted-$ATTEMPT" ] \
            || fail "permit_fail did not upload its reports"
          [ "$STRICT" = failure ] || fail "failing tests did not fail"
          [ "$STRICT_TESTS" = failed ] \
            || fail "failing tests did not report failed"
          [ "$STRICT_PATH" = "$GITHUB_WORKSPACE/failing/test-reports" ] \
            || fail "artefact_path is not the directory below path_prefix"
          [ "$STRICT_JUNIT" = "$STRICT_PATH/junit.xml" ] \
            || fail "the JUnit report is not in artefact_path"
          [ -s "$GITHUB_WORKSPACE/failing/test-reports/junit.xml" ] \
            || fail "artefact_path does not keep the JUnit report"
          [ "$STRICT_NAME" = "rust-test-failing-strict-$ATTEMPT" ] \
            || fail "the failing step did not upload its reports"
          [ "$BAD_BOOLEAN" = failure ] || fail "an invalid boolean did not fail"
          [ "$BAD_BOOLEAN_TESTS" = failed ] \
            || fail "an input check failure did not report failed tests"
          [ "$BAD_PACKAGE" = failure ] || fail "an invalid package did not fail"
          [ "$BAD_JUNIT" = failure ] || fail "junit with cargo did not fail"
          [ "$BAD_PATH" = failure ] \
            || fail "an outside path_prefix did not fail"
          exit "$failed"
