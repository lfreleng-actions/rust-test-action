# SPDX-FileCopyrightText: 2026 The Linux Foundation

# rust-test-action
name: "🦀 Rust Test"
# yamllint disable-line rule:line-length
description: "Runs a Rust project's tests with cargo test or cargo-nextest, with optional coverage and JUnit XML reports"
# Steps: validate every input, install cargo-nextest and cargo-llvm-cov
# when needed (checksummed prebuilt binaries only), run the tests, then
# upload any reports, also after a test failure.

inputs:
  # Optional
  path_prefix:
    description: "Directory holding the project, inside the workspace"
    required: false
    default: "."
  manifest_path:
    description: "Path to the Cargo.toml to test, relative to path_prefix"
    required: false
    default: "Cargo.toml"
  workspace:
    # yamllint disable-line rule:line-length
    description: "Test every workspace member, cargo --workspace; packages, when set, replace it"
    required: false
    default: "true"
  packages:
    # yamllint disable-line rule:line-length
    description: "Whitespace-separated packages to test, cargo -p; overrides workspace"
    required: false
    default: ""
  exclude:
    # yamllint disable-line rule:line-length
    description: "Whitespace-separated packages to leave out; needs workspace 'true', no packages"
    required: false
    default: ""
  features:
    description: "Space- or comma-separated features to enable"
    required: false
    default: ""
  all_features:
    description: "Enable every feature, cargo --all-features"
    required: false
    default: "false"
  no_default_features:
    description: "Disable the default features, cargo --no-default-features"
    required: false
    default: "false"
  toolchain:
    # yamllint disable-line rule:line-length
    description: "rustup toolchain to use; empty uses the one rustup selects for the project"
    required: false
    default: ""
  toolchain_components:
    # yamllint disable-line rule:line-length
    description: "rustup components to install into the toolchain, separated by whitespace or commas"
    required: false
    default: ""
  toolchain_targets:
    # yamllint disable-line rule:line-length
    description: "Target triples to install into the toolchain, separated by whitespace or commas"
    required: false
    default: ""
  lockfile_required:
    # yamllint disable-line rule:line-length
    description: "Fail when Cargo.lock is missing, rather than generating one with a warning"
    required: false
    default: "false"
  setup_script:
    # yamllint disable-line rule:line-length
    description: "Script, relative to path_prefix, run with bash in the project directory before the tests"
    required: false
    default: ""
  test_runner:
    # yamllint disable-line rule:line-length
    description: "'cargo' (cargo test) or 'nextest' (cargo nextest run)"
    required: false
    default: "cargo"
  nextest_version:
    description: "cargo-nextest version to install for the nextest runner"
    required: false
    default: "0.9.146"
  test_args:
    # yamllint disable-line rule:line-length
    description: "Extra runner arguments, split on whitespace and never run through a shell"
    required: false
    default: ""
  doc_tests:
    # yamllint disable-line rule:line-length
    description: "Run doc tests; with nextest or coverage, as a separate cargo test --doc"
    required: false
    default: "true"
  coverage:
    # yamllint disable-line rule:line-length
    description: "Run the tests under cargo-llvm-cov and write lcov and Cobertura reports"
    required: false
    default: "false"
  llvm_cov_version:
    description: "cargo-llvm-cov version to install for coverage"
    required: false
    default: "0.9.1"
  junit:
    # yamllint disable-line rule:line-length
    description: "Write JUnit XML ('true'/'false'); empty means 'true' for nextest, cargo cannot"
    required: false
    default: ""
  artefact_upload:
    description: "Upload the JUnit and coverage reports as an artefact"
    required: false
    default: "true"
  artefact_name:
    # yamllint disable-line rule:line-length
    description: "Name of the report artefact; give each matrix leg its own"
    required: false
    default: "rust-test-results"
  artefact_path:
    # yamllint disable-line rule:line-length
    description: "Report directory relative to path_prefix, empty or absent; empty uses a new one below RUNNER_TEMP"
    required: false
    default: ""
  permit_fail:
    # yamllint disable-line rule:line-length
    description: "Report success with a warning when tests fail, even if they leave reports unwritten; other failures still fail"
    required: false
    default: "false"
  summary:
    description: "Write a results table to the job summary"
    required: false
    default: "true"

outputs:
  toolchain:
    description: "Toolchain used: a rustup channel, a path, or empty"
    value: ${{ steps.test.outputs.toolchain }}
  toolchain_kind:
    description: "How the toolchain was found: 'channel', 'path' or 'none'"
    value: ${{ steps.test.outputs.toolchain_kind }}
  cargo_version:
    # yamllint disable-line rule:line-length
    description: "Cargo version that ran the tests; the action fails when it cannot read it"
    value: ${{ steps.test.outputs.cargo_version }}
  rustc_version:
    # yamllint disable-line rule:line-length
    description: "rustc version that built the tests; the action fails when it cannot read it"
    value: ${{ steps.test.outputs.rustc_version }}
  tests_outcome:
    # yamllint disable-line rule:line-length
    description: "'passed' or 'failed'; 'failed' also when the action stopped early"
    # The test step sets it whenever it runs; it does not run when
    # input checks or the tool installation fail.
    value: ${{ steps.test.outputs.tests_outcome || 'failed' }}
  coverage_percent:
    # yamllint disable-line rule:line-length
    description: "Line coverage percentage to two decimals, such as 87.50; empty without coverage"
    value: ${{ steps.test.outputs.coverage_percent }}
  junit_path:
    description: "Absolute path of the JUnit XML report; empty when none"
    value: ${{ steps.test.outputs.junit_path }}
  coverage_lcov_path:
    description: "Absolute path of the lcov coverage report; empty when none"
    value: ${{ steps.test.outputs.coverage_lcov_path }}
  coverage_cobertura_path:
    # yamllint disable-line rule:line-length
    description: "Absolute path of the Cobertura XML coverage report; empty when none"
    value: ${{ steps.test.outputs.coverage_cobertura_path }}
  artefact_name:
    description: "Name of the uploaded report artefact; empty when none"
    # yamllint disable-line rule:line-length
    value: ${{ steps.upload.outputs.artifact-id != '' && steps.test.outputs.artefact_name || '' }}
  artefact_path:
    # yamllint disable-line rule:line-length
    description: "Absolute path of the report directory; empty when stopped before the tests"
    value: ${{ steps.test.outputs.artefact_path }}

runs:
  using: "composite"
  steps:
    - name: "Check inputs"
      id: prepare
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_PATH_PREFIX: ${{ inputs.path_prefix }}
        INPUT_MANIFEST_PATH: ${{ inputs.manifest_path }}
        INPUT_WORKSPACE: ${{ inputs.workspace }}
        INPUT_PACKAGES: ${{ inputs.packages }}
        INPUT_EXCLUDE: ${{ inputs.exclude }}
        INPUT_FEATURES: ${{ inputs.features }}
        INPUT_ALL_FEATURES: ${{ inputs.all_features }}
        INPUT_NO_DEFAULT_FEATURES: ${{ inputs.no_default_features }}
        INPUT_TOOLCHAIN: ${{ inputs.toolchain }}
        INPUT_TOOLCHAIN_COMPONENTS: ${{ inputs.toolchain_components }}
        INPUT_TOOLCHAIN_TARGETS: ${{ inputs.toolchain_targets }}
        INPUT_LOCKFILE_REQUIRED: ${{ inputs.lockfile_required }}
        INPUT_SETUP_SCRIPT: ${{ inputs.setup_script }}
        INPUT_TEST_RUNNER: ${{ inputs.test_runner }}
        INPUT_NEXTEST_VERSION: ${{ inputs.nextest_version }}
        INPUT_TEST_ARGS: ${{ inputs.test_args }}
        INPUT_DOC_TESTS: ${{ inputs.doc_tests }}
        INPUT_COVERAGE: ${{ inputs.coverage }}
        INPUT_LLVM_COV_VERSION: ${{ inputs.llvm_cov_version }}
        INPUT_JUNIT: ${{ inputs.junit }}
        INPUT_ARTEFACT_UPLOAD: ${{ inputs.artefact_upload }}
        INPUT_ARTEFACT_NAME: ${{ inputs.artefact_name }}
        INPUT_ARTEFACT_PATH: ${{ inputs.artefact_path }}
        INPUT_PERMIT_FAIL: ${{ inputs.permit_fail }}
        INPUT_SUMMARY: ${{ inputs.summary }}
      run: bash "$ACTION_PATH/scripts/prepare.sh"

    # Prebuilt, checksummed binaries only: 'fallback: none' refuses to
    # build a version the pinned install-action does not list.
    - name: "Install cargo tools"
      if: steps.prepare.outputs.tools != ''
      # yamllint disable-line rule:line-length
      uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
      with:
        tool: ${{ steps.prepare.outputs.tools }}
        fallback: none

    - name: "Run tests"
      id: test
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_PATH_PREFIX: ${{ inputs.path_prefix }}
        INPUT_MANIFEST_PATH: ${{ inputs.manifest_path }}
        INPUT_WORKSPACE: ${{ inputs.workspace }}
        INPUT_PACKAGES: ${{ inputs.packages }}
        INPUT_EXCLUDE: ${{ inputs.exclude }}
        INPUT_FEATURES: ${{ inputs.features }}
        INPUT_ALL_FEATURES: ${{ inputs.all_features }}
        INPUT_NO_DEFAULT_FEATURES: ${{ inputs.no_default_features }}
        INPUT_TOOLCHAIN: ${{ inputs.toolchain }}
        INPUT_TOOLCHAIN_COMPONENTS: ${{ inputs.toolchain_components }}
        INPUT_TOOLCHAIN_TARGETS: ${{ inputs.toolchain_targets }}
        INPUT_LOCKFILE_REQUIRED: ${{ inputs.lockfile_required }}
        INPUT_SETUP_SCRIPT: ${{ inputs.setup_script }}
        INPUT_TEST_RUNNER: ${{ inputs.test_runner }}
        INPUT_NEXTEST_VERSION: ${{ inputs.nextest_version }}
        INPUT_TEST_ARGS: ${{ inputs.test_args }}
        INPUT_DOC_TESTS: ${{ inputs.doc_tests }}
        INPUT_COVERAGE: ${{ inputs.coverage }}
        INPUT_LLVM_COV_VERSION: ${{ inputs.llvm_cov_version }}
        INPUT_JUNIT: ${{ inputs.junit }}
        INPUT_ARTEFACT_UPLOAD: ${{ inputs.artefact_upload }}
        INPUT_ARTEFACT_NAME: ${{ inputs.artefact_name }}
        INPUT_ARTEFACT_PATH: ${{ inputs.artefact_path }}
        INPUT_PERMIT_FAIL: ${{ inputs.permit_fail }}
        INPUT_SUMMARY: ${{ inputs.summary }}
      run: bash "$ACTION_PATH/scripts/run-tests.sh"

    # Runs after failing tests too, with or without permit_fail, so the
    # reports explain the failure. report_dir is set only when uploads
    # are on and the directory holds regular files alone.
    - name: "Upload test reports"
      id: upload
      if: ${{ !cancelled() && steps.test.outputs.report_dir != '' }}
      # yamllint disable-line rule:line-length
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.test.outputs.artefact_name }}
        path: ${{ steps.test.outputs.report_dir }}
        if-no-files-found: warn
